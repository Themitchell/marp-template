name: deploy

concurrency:
  group: stage-3-deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [build]
    types:
      - completed
  pull_request:
    types:
      - closed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  gate:
    if: |
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Decide whether to deploy
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR closed: always allow cleanup
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.workflow_run.event }}" != "pull_request" ]; then
            # push to main: production deploy
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -z "$pr" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          has_deploy="$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq 'any(.labels[].name; . == "deploy")')"
          echo "should_deploy=$has_deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Download site
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: marp-site
          path: build/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy preview
        if: |
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          action: deploy
          source-dir: ./build/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}

      - name: Remove preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      - name: Deploy production
        if: |
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./build/
          clean-exclude: pr-preview/
