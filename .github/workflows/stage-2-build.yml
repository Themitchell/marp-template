name: build

concurrency:
  group: stage-2-build-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [test]
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Decide whether to build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.workflow_run.event }}" != "pull_request" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -z "$pr" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          has_deploy="$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq 'any(.labels[].name; . == "deploy")')"
          echo "should_build=$has_deploy" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy images
        run: mkdir build && cp -R img build/img

      - name: Marp Build (README)
        uses: docker://marpteam/marp-cli:latest
        with:
          args: README.md -o build/index.html
        env:
          MARP_USER: root:root

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: marp-site
          path: build/
          retention-days: 1
