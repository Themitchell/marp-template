name: automerge

on:
  workflow_run:
    workflows: [test]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -z "$pr" ]; then
            echo "No pull request associated with this workflow run"
            exit 0
          fi

          author="$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq .user.login)"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "Skipping non-Dependabot PR #$pr (author: $author)"
            exit 0
          fi

          gh pr merge --squash --auto "$pr" --repo "${{ github.repository }}"
